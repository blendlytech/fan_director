<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Question Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cream: '#FDF8F3',
                        panel: '#FFFFFF',
                        espresso: '#302720',
                        muted: '#70625C',
                        rose: '#E4A4BD',
                        deeprose: '#84485D',
                        divider: '#DED3CB'
                    },
                    transitionDuration: {
                        '160': '160ms',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream font-sans text-espresso overflow-hidden">
    
    <!-- Background Simulating Dashboard Dashboard (Blurred out) -->
    <div class="min-h-screen p-8 flex items-start justify-center" data-sd-id="1">
        <div class="w-full max-w-[1320px] grid grid-cols-1 md:grid-cols-2 gap-6 opacity-30 blur-[2px] pointer-events-none" data-sd-id="2">
            <div class="h-64 bg-white rounded-[12px] border border-divider shadow-sm" data-sd-id="3"></div>
            <div class="h-64 bg-white rounded-[12px] border border-divider shadow-sm" data-sd-id="4"></div>
            <div class="h-64 bg-white rounded-[12px] border border-divider shadow-sm" data-sd-id="5"></div>
            <div class="h-64 bg-white rounded-[12px] border border-divider shadow-sm" data-sd-id="6"></div>
        </div>
    </div>

    <!-- Modal Overlay Backdrop -->
    <div class="fixed inset-0 bg-espresso/30 backdrop-blur-[2px] z-50 flex items-center justify-center p-4 sm:p-6" data-sd-id="7">
        
        <!-- Modal Container -->
        <div class="bg-panel w-full max-w-[600px] rounded-[12px] shadow-[0_20px_60px_rgba(0,0,0,0.08)] relative overflow-hidden flex flex-col animate-[fadeIn_200ms_ease-out]" data-sd-id="8">
            
            <!-- Header -->
            <div class="px-8 pt-8 pb-6 border-b border-divider flex items-center justify-between" data-sd-id="9">
                <h2 class="font-serif text-3xl font-semibold text-espresso" data-sd-id="10">
                    Ask a Question
                </h2>
                <a href="https://p.superdesign.dev/draft/c6e6d108-a7c9-4d51-90b2-4090ebce1a93" id="close-modal-link" class="w-10 h-10 flex items-center justify-center rounded-full bg-cream hover:bg-divider/50 text-muted hover:text-espresso transition-colors duration-160" data-sd-id="11">
                    <iconify-icon icon="lucide:x" width="24"></iconify-icon>
                </a>
            </div>

            <!-- Content Body -->
            <div class="p-8 flex-1" data-sd-id="12">
                
                <!-- Context Block -->
                <div class="bg-cream border border-divider rounded-xl p-5 mb-8 flex gap-4 items-start" data-sd-id="13">
                    <div class="w-10 h-10 rounded-full bg-panel border border-divider flex items-center justify-center text-sm font-medium text-espresso shrink-0 mt-0.5" data-sd-id="14">
                        SS
                    </div>
                    <div data-sd-id="15">
                        <p class="text-xs text-muted uppercase tracking-wider mb-1" data-sd-id="16">Regarding request</p>
                        <p class="text-base font-medium text-espresso mb-1" data-sd-id="17">
                            Vintage Lounge Greeting
                        </p>
                        <p class="text-sm text-muted" data-sd-id="18">
                            From Sarah Smiles (@sarah_smiles) · Estimated $145.00
                        </p>
                    </div>
                </div>

                <!-- Message Form -->
                <div class="mb-2" data-sd-id="19">
                    <label for="question-input" class="block text-sm font-medium text-espresso mb-2" data-sd-id="20">
                        Message to Fan
                    </label>
                    <textarea id="question-input" class="w-full h-32 p-4 bg-panel border border-divider rounded-xl text-sm text-espresso placeholder:text-muted/60 focus:outline-none focus:border-rose focus:ring-1 focus:ring-rose resize-none transition-all duration-160" placeholder="Ask your question about the request details, wardrobe, or script..." data-sd-id="21">Hi Sarah, thanks for the request! Just to clarify, when you say you want the standard vintage armchair setup, did you want the side table with the floral arrangement included, or kept minimal?</textarea>
                </div>
                
                <!-- Character Counter -->
                <div class="flex justify-end mb-8" data-sd-id="22">
                    <span class="text-xs font-medium text-muted" data-sd-id="23">
                        218 / 500 characters
                    </span>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4" data-sd-id="24">
                    <button data-go="05-creator-detail-modal-connected-navigation.html" class="flex-1 h-[48px] flex items-center justify-center gap-2 bg-cream border border-divider text-espresso font-medium rounded-xl hover:bg-cream/80 hover:border-espresso transition-all duration-160" data-sd-id="25">
                        Cancel
                    </button>
                    <button data-go="05-creator-detail-modal-connected-navigation.html" data-note="the question goes to the fan. Nothing is sent from this design." class="flex-1 h-[48px] flex items-center justify-center gap-2 bg-rose text-espresso font-medium rounded-xl hover:bg-[#D595AE] transition-all duration-160 shadow-sm" data-sd-id="26">
                        <iconify-icon icon="lucide:send" width="18"></iconify-icon>
                        Send Message
                    </button>
                </div>

            </div>
            
        </div>
    </div>


<!-- DESIGN WALK-THROUGH (same block in every design). Buttons and links jump to the
     state they lead to, here or in another design. Nothing is saved, sent or charged.
     data-go="#id" or "NN-file.html#id" sets the destination; data-note explains an
     action whose result isn't drawn. On p.superdesign.dev, draft links work as before. -->
<style>
  [id] { scroll-margin-top: 100px; }
  .walk-flash { outline: 3px solid #84485D !important; outline-offset: 6px; border-radius: 12px; }
  #walk-note { position: fixed; left: 50%; bottom: 16px; z-index: 60; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: #302720; color: #FDF8F3; font: 400 14px/1.45 Inter, sans-serif; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
  #walk-note[hidden] { display: none; }
  @media print { #walk-note, #walk-menu { display: none !important; } }
</style>
<script>
(function () {
  var F = {
    entrance: '02-boutique-entrance-connected.html', dashboard: '03-creator-dashboard-linked-navigation.html',
    director: '04-linked-ai-director-workspace.html', detail: '05-creator-detail-modal-connected-navigation.html',
    ask: '06-linked-ask-question-modal.html', review: '07-linked-review-scene-card-page.html',
    sent: '08-send-confirmation.html', decline: '09-decline-confirmation-modal-with-navigation.html',
    saved: '10-saved-ideas.html'
  };
  // href="#name" links that point at an app route rather than this page.
  var ROUTES = {
    home: F.entrance, collection: F.entrance, studio: F.director, saved: F.saved,
    'sign-in': '16-sign-in.html#a-label', 'creator-sign-in': '16-sign-in.html#c-label',
    catalog: '17-ai-director-live-states.html#catalog', rules: '13-creator-limits.html#limits-panel',
    'limits-panel': '13-creator-limits.html#limits-panel', 'custom-request': '19-custom-request-pending.html#a-label',
    requests: F.dashboard, 'creator-requests': F.dashboard, request: F.detail
  };
  // Superdesign draft links, by the first block of the draft id.
  var DRAFTS = {
    '048b6b8a': F.director, '82277dd9': F.entrance, '48723685': F.review, 'a98b81cb': F.sent,
    'c6e6d108': F.detail, '2b65d4ed': F.dashboard, '5d2c9ba0': F.ask, '7fc2a528': F.decline,
    '5a21d2ca': F.review, 'b7e484e4': F.saved
  };
  var here = location.pathname.split('/').pop();
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var noteEl, noteTimer;

  function note(text) {
    if (!noteEl) {
      noteEl = document.createElement('div');
      noteEl.id = 'walk-note';
      noteEl.setAttribute('role', 'status');
      noteEl.hidden = true;
      document.body.appendChild(noteEl);
    }
    noteEl.textContent = 'Design only: ' + text;
    noteEl.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { noteEl.hidden = true; }, 6000);
  }

  function show(el) {
    var box = /-(label|title)$/.test(el.id) ? (el.closest('section') || el) : el;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    if (!box.matches('a,button,input,select,textarea,[tabindex]')) box.setAttribute('tabindex', '-1');
    box.focus({ preventScroll: true });
    box.classList.add('walk-flash');
    setTimeout(function () { box.classList.remove('walk-flash'); }, 1600);
  }

  function go(dest) {
    var parts = dest.split('#'), file = parts[0], id = parts[1];
    if (file && file !== here) { location.href = dest; return; }
    var el = id ? document.getElementById(id) : null;
    if (el) show(el); else window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }

  function toggleMenu(btn) {
    var menu = document.getElementById('walk-menu');
    if (!menu) {
      var nav = document.querySelector('header nav');
      if (!nav) { note('the menu isn’t drawn for this page.'); return; }
      menu = document.createElement('div');
      menu.id = 'walk-menu';
      menu.className = 'md:hidden border-t border-divider bg-cream px-4 py-2';
      menu.hidden = true;
      Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
        var link = a.cloneNode(true);
        link.removeAttribute('id');
        link.className = 'flex min-h-[48px] items-center text-base font-medium focus-ring';
        menu.appendChild(link);
      });
      btn.closest('header').appendChild(menu);
      btn.setAttribute('aria-controls', 'walk-menu');
    }
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', String(!menu.hidden));
    if (!menu.hidden) { var first = menu.querySelector('a'); if (first) first.focus(); }
  }

  document.addEventListener('keydown', function (e) {
    var menu = document.getElementById('walk-menu');
    if (e.key === 'Escape' && menu && !menu.hidden) {
      var btn = document.querySelector('[aria-controls="walk-menu"]');
      toggleMenu(btn); btn.focus();
    }
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('a,button');
    if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
    var dest = t.getAttribute('data-go'), text = t.getAttribute('data-note');
    var href = t.tagName === 'A' ? (t.getAttribute('href') || '') : '';

    if (t.tagName === 'BUTTON' && !dest && t.hasAttribute('aria-expanded') && /menu/i.test(t.textContent)) {
      e.preventDefault(); toggleMenu(t); return;
    }
    if (!dest && href.indexOf('p.superdesign.dev/draft/') > -1) {
      if (location.hostname === 'p.superdesign.dev') return;
      dest = DRAFTS[href.split('/draft/')[1].slice(0, 8)];
      if (!dest) return;
    }
    if (!dest && href.charAt(0) === '#') {
      var name = href.slice(1);
      if (name && document.getElementById(name)) dest = '#' + name;
      else if (ROUTES[name]) dest = ROUTES[name];
      else if (!text) text = 'this page isn’t designed yet.';
    }
    if (!dest && !text && t.tagName === 'BUTTON') {
      text = document.body.getAttribute('data-walk-default') || 'this button’s next state isn’t drawn yet.';
    }
    if (!dest && !text) return;

    e.preventDefault();
    if (dest) go(dest);
    if (text) note(text);
  });

  if (location.hash) {
    var target = document.getElementById(location.hash.slice(1));
    if (target) setTimeout(function () { show(target); }, 300);
  }
})();
</script>
</body></html>
